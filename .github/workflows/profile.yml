name: Refresh Profile Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate self-hosted profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: overview,contributions,repositories,languages
          output-dir: profile
          themes: dark
          commit: false

      - name: Convert cards to PNG for GitHub mobile compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for f in profile/contributions.dark.svg profile/repositories.dark.svg profile/overview.dark.svg profile/languages.dark.svg; do
            rsvg-convert -f png -o "${f%.svg}.png" "$f"
          done

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark

      - name: Verify generated assets
        run: |
          test -s profile/contributions.dark.png
          test -s profile/repositories.dark.png
          test -s profile/overview.dark.png
          test -s profile/languages.dark.png
          test -s profile/github-snake-dark.svg

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --cached --quiet; then
            echo "No profile asset changes."
          else
            git commit -m "chore(profile): refresh self-hosted assets [skip ci]"
            git push
          fi
